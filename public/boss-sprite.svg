<svg width="320" height="240" viewBox="0 0 320 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="240" fill="#1E2937"/>
  
  <!-- Boss character -->
  <rect x="20" y="20" width="280" height="200" fill="#4B5563" rx="10"/>
  
  <!-- Boss head -->
  <circle cx="160" cy="120" r="40" fill="#FF6B69"/>
  
  <!-- Eyes -->
  <circle cx="140" cy="100" r="8" fill="#000000"/>
  <circle cx="180" cy="100" r="8" fill="#000000"/>
  
  <!-- Mouth -->
  <path d="M140 140 Q160 160 180 140" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Title -->
  <text x="160" y="200" font-family="Arial" font-size="16" fill="#FFFFFF" text-anchor="middle">BOSS SPRITE SHEET</text>
</svg>
